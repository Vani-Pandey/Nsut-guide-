<!-- Form -->
<section class="form-section">
<h2>Report Item</h2>

<form id="itemForm">

<select id="type" required>
  <option value="">Select Type</option>
  <option value="Lost">Lost</option>
  <option value="Found">Found</option>
</select>

<input type="text" id="title" placeholder="Enter Item Name" required>

<input type="text" id="place" placeholder="Enter Place (APJ Block, Canteen, Hostel...)">

<textarea id="description" placeholder="Enter Description"></textarea>
<input type="text" id="phone" placeholder="Enter Contact Phone Number" required>


<input type="file" id="image" accept="image/*">

<button type="submit">Submit</button>

</form>
</section>
